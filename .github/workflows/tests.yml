name: Tests

# A pull_request trigger can only fire from the repository the PR is opened
# against, so this stub has to live here even though every other fogproject
# workflow lives in FOGProject/fog-workflows. It is deliberately six lines:
# all of the logic is in the reusable workflow, so fixing the runner does not
# mean editing this file on three branches.
#
# For pull_request events GitHub reads workflows from the merge of head into
# base, so one copy on each BASE branch (working-1.6, dev-branch, stable)
# covers every PR opened against it -- the contributor's branch needs
# nothing.
#
# Not a push trigger, and not because of caution: the runaway that put ~30
# commits on dev-branch in 20 minutes happened because the triggered
# workflow pushed a commit back here.
#
# The `suite` job only reads. The `regen` job below DOES push -- one commit, to
# the pull request's head branch, after the suite has gone green -- and that
# push raises `synchronize`, so this file runs again. That is bounded rather
# than open-ended: both operations it performs are idempotent, so the second
# run finds nothing to do and pushes nothing. The full argument, and the two
# runtime circuit breakers that hold even if that argument stops being true,
# are at the top of fog-workflows' fogproject-pr-regen.yml. Read them before
# changing either job.
#
# THE GUARDS ON `regen` ARE NOT DECORATION
#
# Same-repo: `pull_request` withholds secrets from a fork, so there is no App
# token to mint, the App is not installed on the contributor's account anyway,
# and pushing to a fork head needs maintainer_can_modify, which is theirs to
# set. A merged fork PR is picked up by the daily sweep instead, exactly as it
# is today.
#
# Head denylist: workflows for a `pull_request` are read from the merge of head
# into base, so a PR whose HEAD is a long-lived branch runs this file too.
# stable-releases.yml opens exactly such a PR (`stable` -> `dev-branch`) to sync
# a release back. Without this list, widening the base allowlist to dev-branch
# would have this job push commits onto `stable` -- a branch whose version is
# owned exclusively by stable-releases.yml. It is unreachable while the base
# allowlist names only working-1.6; it is here so that stays true when the
# allowlist grows.

on:
  pull_request:

jobs:
  suite:
    # Named because the job KEY is what GitHub puts in the middle of a called
    # workflow's check name, so an unnamed `suite:` rendered every check as
    # "Tests / suite / tests (PHP 7.4)". Every job in the reusable workflow is
    # named already; this was the one link in the chain that was not.
    #
    # `fogproject` rather than something generic because fog-workflows hosts
    # fog-plugins-tests.yml alongside fogproject-tests.yml, so which project's
    # suite is running is the useful thing for this segment to say.
    #
    # This DOES change the reported check name (suite / ... -> fogproject /
    # ...). Safe here only because working-1.6 currently has no branch
    # protection and no ruleset requiring status checks -- both verified, not
    # assumed. If required checks are ever added, register the new names.
    name: fogproject
    uses: FOGProject/fog-workflows/.github/workflows/fogproject-tests.yml@main

  # Regenerates the derived files -- PSR2 formatting and the gettext catalogue
  # -- on this pull request, and pushes one commit to its head branch. All of
  # the logic is in fog-workflows; what lives here is the POLICY of which pull
  # requests are eligible, which is branch-local information and is already
  # where sync-generated-files.yml keeps the identical allowlist.
  #
  # `needs: suite` IS the "all current tests passed" gate. A caller job that
  # `uses:` a reusable workflow succeeds only if every job inside it succeeded,
  # so this needs no aggregate job on the far side. Note the custom `if:` below
  # does not weaken it: only always()/!cancelled()/failure() bypass a `needs:`
  # requirement, so the guard is pure policy on top of "the suite went green".
  regen:
    name: regenerate
    needs: suite
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref == 'working-1.6'
      && !contains(fromJson('["stable", "master", "dev-branch", "working-1.6"]'), github.event.pull_request.head.ref)

    # Least privilege, stated rather than inherited -- the same reasoning as
    # sync-generated-files.yml next door. Everything the called workflow writes
    # uses a GitHub App token, so nothing on this path needs a writable
    # GITHUB_TOKEN, and a called workflow can never hold more permission than
    # its caller.
    permissions:
      contents: read

    uses: FOGProject/fog-workflows/.github/workflows/fogproject-pr-regen.yml@main
    with:
      # Also compute the version this branch will carry once its merge commit
      # lands, and commit it here rather than after the merge.
      #
      # THIS LINE DEPENDS ON A RULESET, NOT JUST ON THE WORKFLOW.
      #
      # FOG_VERSION is the commit count since master, so predicting it before
      # the merge is only possible while the ruleset on working-1.6 enforces
      # BOTH of:
      #
      #   * "Require branches to be up to date before merging" -- so base is an
      #     ancestor of head and the merge brings nothing in from base's side;
      #   * merge commits as the only allowed merge method -- so the merge adds
      #     exactly one commit. Squash collapses N commits into 1 and makes the
      #     count unrecoverable; rebase adds no merge commit at all. Either one
      #     silently makes every version written here wrong.
      #
      # If either setting is turned off, revert this line in the same change.
      # The merge-time sync in sync-generated-files.yml still runs and will
      # correct the version afterwards, so the failure mode is churn rather
      # than a wrong version reaching a release -- but it is silent, and this
      # comment is the only place it is written down.
      sync_version: true
    secrets: inherit
